name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# bench and runs its verification phase (every kernel against a CPU reference)
# on a simulated NVIDIA H100 (https://github.com/pantheongpu/pantheonsim).
# A simulator has no timing model, so the timings it prints are meaningless and
# the benchmark itself runs with tiny sizes only to let the program finish.

on:
  push:
    branches: [verify-gpu-sim]
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "Makefile"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (CUDA 13.0 and simulated H100)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@a1b9d4237411f9b2b0e0bb895b4d83377f336a7b # v0.1.9
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # compute_90 embeds PTX only, which the simulator runs. The simulator
      # needs a shared CUDA runtime.
      - name: Build
        run: vgpu run --preload make bench ARCH=compute_90 NVFLAGS="-O3 -std=c++17 -lineinfo -arch=compute_90 -cudart shared"

      # bench exits with 1 if any verification fails, and prints a PASS line
      # per kernel. Timing output is ignored.
      - name: Verify kernels
        shell: bash
        run: |
          set -o pipefail
          vgpu run ./bench --sizes 64 --vec-size 4096 --reduce-size 4096 --iters 1 | tee bench.log
          if grep -Eq "FAIL|CUDA error|verification FAILED" bench.log; then
            echo "::error::a check failed"
            exit 1
          fi
          grep -q "== verification against CPU reference ==" bench.log
          grep -Eq "PASS  vec_add" bench.log
          grep -Eq "PASS  matmul_" bench.log
          grep -Eq "PASS  reduce_" bench.log
          test "$(grep -c '  PASS  ' bench.log)" -ge 8
